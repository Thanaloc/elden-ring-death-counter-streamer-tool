name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necessaire pour creer la Release et y attacher l'exe

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Recuperer Tesseract
        run: |
          choco install tesseract --no-progress -y
          mkdir tesseract
          copy "C:\\Program Files\\Tesseract-OCR\\tesseract.exe" tesseract\\
          copy "C:\\Program Files\\Tesseract-OCR\\*.dll" tesseract\\
          xcopy /E /I "C:\\Program Files\\Tesseract-OCR\\tessdata" tesseract\\tessdata
      - run: >
          pyinstaller --onefile --name elden-counter
          --add-data "eldencounter/overlay;eldencounter/overlay"
          --add-data "tesseract;tesseract"
          --collect-submodules keyboard
          --collect-all cv2
          entrypoint.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/elden-counter.exe
          generate_release_notes: true
