name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the Release and attach the exe

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install . pyinstaller

      - name: Prepare Tesseract and its languages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          choco install tesseract --no-progress -y

          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) {
            throw "Tesseract not found in $src after install"
          }

          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe" "tesseract\"
          Copy-Item "$src\*.dll" "tesseract\"
          Copy-Item "$src\tessdata\*.traineddata" "tesseract\tessdata\"

          # Chocolatey ships English only. Without these files the tool is
          # useless to anyone not playing in English, so a failure here must
          # break the build rather than slip through.
          foreach ($lang in @("fra", "deu", "spa", "ita", "por", "rus")) {
            $out = "tesseract\tessdata\$lang.traineddata"
            $url = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            $size = (Get-Item $out).Length
            if ($size -lt 100000) {
              throw "$lang.traineddata is $size bytes: bad download"
            }
            Write-Host "$lang : $size bytes"
          }

          Write-Host "`nContents of tesseract\tessdata:"
          Get-ChildItem "tesseract\tessdata" | ForEach-Object {
            Write-Host ("  {0}  {1} bytes" -f $_.Name, $_.Length)
          }

      - name: Build the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --onefile --name elden-counter `
            --add-data "eldencounter/overlay;eldencounter/overlay" `
            --add-data "tesseract;tesseract" `
            --collect-submodules keyboard `
            --collect-all cv2 `
            entrypoint.py

      - name: Verify the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\elden-counter.exe --version
          # The bundle must carry the languages: better to find out here
          # than at the user's machine.
          .\dist\elden-counter.exe languages

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/elden-counter.exe
          generate_release_notes: true
