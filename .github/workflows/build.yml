name: Build

# Every push builds and keeps the result as an artifact, without publishing
# anything. Releases are cut from tags only, so the download page never shows
# a version you have not tried yourself.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Prepare Tesseract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "Tesseract not found" }
          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe" "tesseract\"
          Copy-Item "$src\*.dll" "tesseract\"
          Copy-Item "$src\tessdata\eng.traineddata" "tesseract\tessdata\"
          Copy-Item "$src\tessdata\osd.traineddata" "tesseract\tessdata\"
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --onedir --name elden-counter `
            --add-data "eldencounter/overlay;eldencounter/overlay" `
            --add-data "tesseract;tesseract" `
            --collect-submodules keyboard `
            --collect-all cv2 `
            entrypoint.py
      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\elden-counter\elden-counter.exe --version
          .\dist\elden-counter\elden-counter.exe languages
      - uses: actions/upload-artifact@v4
        with:
          name: elden-counter-windows
          path: dist/elden-counter/
          retention-days: 14
